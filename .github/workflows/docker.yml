# Build runpod/Dockerfile and push ghcr.io/rrenaud/rewarding-doubt:{latest,<sha>} on changes to the
# code it contains. The image is ~10 GB, so the runner's preinstalled toolchains are removed first.
name: docker
on:
  push:
    branches: [main]
    paths: ["runpod/Dockerfile", "runpod/entry.sh", "runpod/selfstop.py", "runpod/eval_snapshots.py", "modal_repro/subset.py",
            "modal_repro/exact_llama.py", "modal_repro/shared_prefix.py", "modal_repro/thinking_llama.py", "modal_repro/frozen_eval.py",
            "src/rewarding_doubt/**", "patches/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/rrenaud/rewarding-doubt:latest
            ghcr.io/rrenaud/rewarding-doubt:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/rrenaud/rewarding-doubt:buildcache
          cache-to: type=registry,ref=ghcr.io/rrenaud/rewarding-doubt:buildcache,mode=max
